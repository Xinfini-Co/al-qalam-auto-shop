<svg width="256" height="256" viewBox="0 0 256 256" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AQAS mark</title>
<desc>Square AQAS monogram mark for favicon and app icon.</desc>
<defs>
<linearGradient id="aqasMark" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#E31937"/>
<stop offset="55%" stop-color="#9B1C8E"/>
<stop offset="100%" stop-color="#2563EB"/>
<animate attributeName="x1" values="0%;30%;0%" dur="6s" repeatCount="indefinite"/>
<animate attributeName="x2" values="100%;130%;100%" dur="6s" repeatCount="indefinite"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="256" height="256" rx="56" fill="#0A0A0B"/>

<circle cx="128" cy="128" r="92" fill="none" stroke="url(#aqasMark)" stroke-width="4" opacity="0.35">
<animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="14s" repeatCount="indefinite"/>
</circle>
<circle cx="128" cy="128" r="92" fill="none" stroke="url(#aqasMark)" stroke-width="4" stroke-dasharray="44 540" stroke-linecap="round">
<animateTransform attributeName="transform" type="rotate" from="360 128 128" to="0 128 128" dur="5s" repeatCount="indefinite"/>
</circle>

<text x="128" y="158" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="700" font-size="64" letter-spacing="-2" fill="url(#aqasMark)">AQAS</text>
</svg>
