<svg width="540" height="360" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AQAS animated logo (dark)</title>
<desc>Animated AQAS monogram on a dark background for Al Qalam Auto Shop.</desc>
<defs>
<linearGradient id="aqasGradD" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#E31937"/>
<stop offset="55%" stop-color="#9B1C8E"/>
<stop offset="100%" stop-color="#2563EB"/>
<animate attributeName="x1" values="0%;30%;0%" dur="6s" repeatCount="indefinite"/>
<animate attributeName="x2" values="100%;130%;100%" dur="6s" repeatCount="indefinite"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="680" height="360" rx="20" fill="#0A0A0B"/>

<circle cx="340" cy="150" r="92" fill="none" stroke="url(#aqasGradD)" stroke-width="3" opacity="0.35">
<animateTransform attributeName="transform" type="rotate" from="0 340 150" to="360 340 150" dur="14s" repeatCount="indefinite"/>
</circle>
<circle cx="340" cy="150" r="92" fill="none" stroke="url(#aqasGradD)" stroke-width="3" stroke-dasharray="40 540" stroke-linecap="round">
<animateTransform attributeName="transform" type="rotate" from="360 340 150" to="0 340 150" dur="5s" repeatCount="indefinite"/>
</circle>

<g font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="600" fill="url(#aqasGradD)" text-anchor="middle">
<text x="296" y="172" font-size="84" letter-spacing="2">A
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="0.5s" begin="0s" fill="freeze"/>
</text>
<text x="340" y="172" font-size="84" letter-spacing="2">Q
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.18s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="0.5s" begin="0.18s" fill="freeze"/>
</text>
<text x="384" y="172" font-size="84" letter-spacing="2">A
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.36s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="0.5s" begin="0.36s" fill="freeze"/>
</text>
<text x="428" y="172" font-size="84" letter-spacing="2">S
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.54s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="0.5s" begin="0.54s" fill="freeze"/>
</text>
</g>

<text x="340" y="280" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="600" font-size="22" letter-spacing="6" fill="#FAFAFA">AL QALAM AUTO SHOP
<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
</text>
<text x="340" y="306" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="400" font-size="12" letter-spacing="3" fill="#A1A1AA">SHARJAH &#183; UAE
<animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.1s" fill="freeze"/>
</text>
</svg>
